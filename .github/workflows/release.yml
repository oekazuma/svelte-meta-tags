name: Release

on:
  push:
    branches:
      - main

permissions: {}
jobs:
  release:
    permissions:
      contents: write # to create release (changesets/action)
      id-token: write # OpenID Connect token needed for provenance
      pull-requests: write # to create pull request (changesets/action)
      actions: write # to start CI on the Version Packages branch
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Vite+ and dependencies
        uses: $/.github/workflows/setup-vp
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: vp run release
        env:
          NPM_CONFIG_PROVENANCE: true
      # the Version Packages pull request is opened with GITHUB_TOKEN, which triggers no workflow,
      # so the required checks would never run; workflow_dispatch is the exception
      - name: Run CI on the Version Packages pull request
        if: steps.changesets.outputs.pr-number != ''
        run: gh workflow run ci.yml --ref "changeset-release/${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
