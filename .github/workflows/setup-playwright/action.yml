name: 'Setup Playwright'
description: 'Cache and install Playwright browsers using the version from pnpm-workspace.yaml'

runs:
  using: 'composite'
  steps:
    # Mirrors playwright.config.ts: PRs test chromium only, so skip the other browsers' system packages.
    - name: Resolve Playwright version and browsers
      shell: bash
      run: |
        echo "PLAYWRIGHT_VERSION=$(grep '@playwright/test' pnpm-workspace.yaml | awk '{print $2}' | sed 's/\^//')" >> "${GITHUB_ENV}"
        echo "PLAYWRIGHT_BROWSERS=${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}" >> "${GITHUB_ENV}"

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    # Skips browser downloads already restored from cache; system packages are always installed.
    - name: Install Playwright browsers and system dependencies
      shell: bash
      run: pnpm --filter svelte-5 exec playwright install --with-deps ${PLAYWRIGHT_BROWSERS}
