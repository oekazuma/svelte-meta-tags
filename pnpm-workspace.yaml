packages:
  - docs/
  - example/
  - packages/*
  - tests/*

minimumReleaseAge: 4320

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  sharp: true

catalog:
  '@changesets/cli': ^3.0.3
  '@playwright/test': ^1.64.1
  '@sveltejs/adapter-auto': ^8.0.0
  '@sveltejs/kit': ^3.1.0
  '@sveltejs/package': ^3.0.1
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  blume: ^2.2.4
  eslint: ^10.13.0
  eslint-plugin-svelte: ^3.23.1
  publint: ^0.3.25
  svelte: ^5.57.2
  svelte-check: ^4.7.7
  typescript: ^6.0.3
  typescript-eslint: ^8.72.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  # takumi 2.16 renamed FontSubset's `ranges`, which blume (as of 2.2.4) still reads; the docs build
  # then fails on the OG images of the Japanese pages. Drop this once blume reads the new field,
  # together with the takumi-js rule in renovate.json that disables its updates.
  takumi-js: 2.14.0
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
