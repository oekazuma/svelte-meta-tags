packages:
  - docs/
  - example/
  - packages/*
  - tests/*

minimumReleaseAge: 4320

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  sharp: true

catalog:
  '@changesets/cli': ^3.0.3
  '@playwright/test': ^1.65.1
  '@sveltejs/adapter-auto': ^8.0.1
  '@sveltejs/kit': ^3.3.1
  '@sveltejs/package': ^3.0.3
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  blume: ^2.2.7
  eslint: ^10.15.0
  eslint-plugin-svelte: ^3.24.1
  publint: ^0.3.25
  svelte: ^5.57.3
  svelte-check: ^4.7.8
  typescript: ^7.0.2
  typescript-eslint: ^8.73.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  # takumi 2.16 renamed FontSubset's `ranges`, which blume (as of 2.2.4) still reads; the docs build
  # then fails on the OG images of the Japanese pages. Drop this once blume reads the new field,
  # together with the takumi-js rule in renovate.json that disables its updates.
  takumi-js: 2.14.0
  vite@*: 'catalog:'
  # Both parents pin a vulnerable exact version even in their latest release. Drop each override once
  # its parent's own pin reaches the patched version.
  '@vercel/routing-utils>path-to-regexp': ^6.3.0
  '@tailwindcss/typography>postcss-selector-parser': ^6.1.6
