packages:
  - docs/
  - example/
  - packages/*
  - tests/*

minimumReleaseAge: 4320

allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  sharp: true

catalog:
  '@changesets/cli': ^3.0.3
  '@playwright/test': ^1.63.0
  '@sveltejs/adapter-auto': ^8.0.0
  '@sveltejs/kit': ^3.0.0
  '@sveltejs/package': ^3.0.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  blume: ^2.1.1
  eslint: ^10.12.0
  eslint-plugin-svelte: ^3.23.0
  publint: ^0.3.25
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  typescript: ^6.0.3
  typescript-eslint: ^8.71.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
